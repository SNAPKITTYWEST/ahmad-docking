[package]
name        = "sna-codec"
version     = "0.1.0"
edition     = "2021"
authors     = ["Ahmad Ali Parr <ahmedparr93@gmail.com>"]
description = "Ahmad Docking -- SNA DNA Storage Codec (encode/decode/manifest)"

[dependencies]
sha2      = "0.10"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Full RS: reed-solomon-erasure = "6"
# Full CRC: crc32fast = "1.3"
